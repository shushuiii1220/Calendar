<style>
  :root{
    color-scheme: light;
    --bg:#E4E8E6; --surface:#FFFFFF; --ink:#20242B; --ink-soft:#4A535C;
    --accent:#2C6E68; --border:#D2D8D5; --muted:#A8A296; --faint:#84887F;
    --sunday:#D64550; --saturday:#3B6FA0; --danger:#B0563F; --danger-bg:#FBEAEA;
    --soft:#EEF1EF; --chip-bg:#E8ECE9; --card-bg:#FFFFFF; --overlay:rgba(32,36,43,.4); --fab-bg:#FFFFFF;
    --accent-soft:#E3EEED; --switch-off:#C7CDC9; --active-tap:#E4E7E5;
  }
  html[data-theme="dark"]{
    color-scheme: dark;
    --bg:#16191C; --surface:#1E2226; --ink:#EDEFEF; --ink-soft:#B7BEC2;
    --accent:#3FA79A; --border:#2E3338; --muted:#8A8F8C; --faint:#8A9094;
    --sunday:#E5707D; --saturday:#6FA0D8; --danger:#E08669; --danger-bg:#3A2723;
    --soft:#262A2E; --chip-bg:#24282C; --card-bg:#1E2226; --overlay:rgba(0,0,0,.55); --fab-bg:#33383D;
    --accent-soft:#1E3230; --switch-off:#3A3F44; --active-tap:#2A2E33;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
  input, textarea, select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    width:100%;max-width:100vw;overflow-x:hidden;
    min-height:100vh;min-height:100dvh;overscroll-behavior:none;touch-action:manipulation;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;}
  button{font:inherit;border:none;background:none;cursor:pointer;color:inherit;touch-action:manipulation;}
  input{font:inherit;}
  #root{min-height:100vh;min-height:100dvh;padding-bottom:calc(24px + env(safe-area-inset-bottom));overscroll-behavior:none;max-width:100vw;overflow-x:hidden;}

  .header{position:sticky;top:0;z-index:10;background:var(--surface);
    border-bottom:1px solid var(--border);padding:calc(18px + env(safe-area-inset-top)) 14px 10px;}
  .nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .nav-left{display:flex;align-items:center;gap:6px;}
  .icon-btn{padding:9px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
  .icon-btn:active{background:var(--active-tap);}
  .today-btn{padding:8px 13px;border-radius:999px;font-size:13px;font-weight:500;
    background:var(--chip-bg);color:var(--ink-soft);flex-shrink:0;}
  select.field{-webkit-appearance:none;appearance:none;}
  .inline-field{border:1px solid var(--border);background:var(--card-bg);font-size:15px;color:var(--accent);
    font-weight:500;text-align:center;padding:5px 10px;border-radius:8px;}
  select.inline-field{-webkit-appearance:none;appearance:none;}
  .title{font-size:16px;font-weight:600;min-width:92px;font-variant-numeric:tabular-nums;}
  .toggle{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--bg);flex-shrink:0;}
  .toggle button{padding:9px 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink-soft);}
  .toggle button.active{background:var(--accent);color:#fff;}
  .ym-row{display:flex;gap:8px;margin-bottom:10px;}
  .ym-select{flex:1;padding:8px 10px;border-radius:10px;font-size:16px;font-weight:500;
    background:var(--soft);border:1px solid var(--border);color:var(--ink);
    -webkit-appearance:none;appearance:none;text-align:center;}

  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
  .header-tools-row{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px;}
  .chip{display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;
    font-size:13px;font-weight:500;white-space:nowrap;flex-shrink:0;border:1px solid transparent;}
  .dot{width:8px;height:8px;border-radius:999px;display:inline-block;flex-shrink:0;}
  .manage-btn{padding:9px;border-radius:999px;background:var(--chip-bg);flex-shrink:0;color:var(--ink-soft);}

  .err-banner{margin:8px 14px 0;font-size:12px;padding:8px 12px;border-radius:10px;background:var(--danger-bg);color:var(--danger);}

  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;
    font-size:12px;font-weight:500;margin-bottom:4px;}
  .month-grid-wrap{padding:0 2px;}
  .month-grid{display:flex;flex-direction:column;gap:6px;padding:10px 12px 0;}
  .week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .day-cell{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    height:72px;display:flex;flex-direction:column;align-items:center;padding:6px 2px 4px;gap:4px;}
  .day-cell.today{border:1.5px solid var(--accent);}
  .day-cell.dim{opacity:.35;}
  .day-num{font-size:14px;font-variant-numeric:tabular-nums;}
  .day-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;}
  .more-count{font-size:9px;color:var(--faint);}

  .week-list{display:flex;flex-direction:column;gap:8px;padding:10px 12px 0;}
  .week-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;}
  .week-card.today{border:1.5px solid var(--accent);}
  .week-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .week-event{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 0;}
  .empty-note{font-size:12px;color:var(--muted);}

  .day-untimed{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0 0;}
  .day-view-wrap{padding:0 12px 10px;}
  .timeline{position:relative;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;overflow:hidden;margin-top:10px;}
  .hour-row{display:flex;height:56px;border-top:1px solid var(--border);}
  .hour-row:first-child{border-top:none;}
  .hour-label{width:46px;flex-shrink:0;text-align:right;padding-right:8px;
    font-size:11px;color:var(--faint);transform:translateY(-7px);}
  .hour-slot{flex:1;}
  .now-line{position:absolute;left:0;right:0;display:flex;align-items:center;pointer-events:none;}
  .now-dot{width:6px;height:6px;border-radius:999px;background:var(--sunday);margin-left:2px;}
  .now-bar{flex:1;height:1.5px;background:var(--sunday);}
  .event-block{position:absolute;left:50px;right:6px;border-radius:8px;padding:4px 8px;
    text-align:left;overflow:hidden;}
  .event-block p{margin:0;}
  .event-title{font-size:12px;font-weight:500;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .event-time{font-size:10px;color:var(--ink-soft);}

  .fab{position:fixed;right:20px;bottom:calc(18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:999px;
    background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(44,110,104,.35);z-index:15;}
  .theme-fab{position:fixed;left:20px;bottom:calc(18px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:999px;
    background:var(--fab-bg);border:1.5px solid var(--border);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(32,36,43,.22);z-index:15;}

  .overlay{position:fixed;inset:0;background:var(--overlay);z-index:20;
    display:flex;align-items:flex-end;}
  .sheet{width:100%;background:var(--card-bg);border-radius:20px 20px 0 0;padding:14px 16px 24px;
    max-height:80vh;overflow-y:auto;overscroll-behavior:contain;}
  .sheet-close-row{display:flex;justify-content:flex-end;margin-bottom:14px;}
  .sheet h2{font-size:16px;font-weight:600;margin:0 0 12px;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}

  .field{width:100%;padding:9px 12px;border-radius:10px;font-size:16px;
    background:var(--soft);border:1px solid var(--border);outline:none;}
  .field-row{display:flex;gap:8px;}
  .form-col{display:flex;flex-direction:column;gap:8px;}
  .label-sm{font-size:12px;color:var(--faint);margin-bottom:3px;}
  .cat-select-row{display:flex;gap:8px;flex-wrap:wrap;}
  .cat-select{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;
    font-size:13px;font-weight:500;border:1px solid;background:var(--card-bg);}
  .actions-row{display:flex;gap:8px;margin-top:6px;}
  .btn-primary{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:13px 16px;border-radius:10px;font-size:15px;font-weight:500;background:var(--accent);color:#fff;}
  .btn-primary:disabled{background:#B7C9C6;}
  .btn-danger{display:flex;align-items:center;justify-content:center;gap:6px;
    padding:13px 16px;border-radius:10px;font-size:15px;font-weight:500;background:var(--danger-bg);color:var(--danger);}

  .event-list-item{display:flex;align-items:center;gap:12px;padding:16px;border-radius:12px;
    background:var(--soft);width:100%;text-align:left;}
  .event-list-item p{margin:0;}

  .cat-row{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;background:var(--soft);margin-bottom:8px;}
  .drag-handle{touch-action:none;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted);
    padding:10px;margin:-6px;cursor:grab;min-width:40px;min-height:40px;}
  .cat-row.dragging{background:var(--card-bg);box-shadow:0 10px 24px rgba(32,36,43,.22);position:relative;z-index:5;touch-action:none;border:1.5px solid var(--accent);}
  .cat-color-input{width:38px;height:38px;border-radius:999px;border:none;padding:0;flex-shrink:0;overflow:hidden;}
  .cat-name-input{flex:1;min-width:0;padding:6px 8px;border-radius:8px;font-size:16px;
    background:var(--card-bg);border:1px solid var(--border);outline:none;}
  .add-cat-btn{margin-top:8px;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:13px;border-radius:10px;font-size:15px;font-weight:500;background:var(--bg);color:var(--accent);}

  .switch{width:44px;height:26px;border-radius:999px;background:var(--switch-off);position:relative;flex-shrink:0;transition:background .15s;}
  .switch.on{background:var(--accent);}
  .switch-thumb{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:999px;background:#fff;
    transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .switch.on .switch-thumb{left:20px;}
  .allday-tag{font-size:10px;font-weight:600;color:var(--accent);background:var(--accent-soft);
    padding:2px 6px;border-radius:5px;margin-right:5px;display:inline-block;vertical-align:middle;}
  .offline-note{font-size:11px;color:var(--faint);text-align:center;padding:4px 20px 0;}
</style>
</head>

<div id="root"></div>

<script>
/* ---------- data helpers ---------- */
const STORAGE_KEY = "calendarAppData";
const DEFAULT_CATEGORIES = [
  { id: "work", name: "仕事", color: "#D6483F" },
  { id: "private", name: "プライベート", color: "#3B6FA0" },
  { id: "other", name: "その他", color: "#5E8C3E" },
];
const COLOR_PRESETS = ["#D6483F","#3B6FA0","#5E8C3E","#8B6DA8","#C48A2E","#2C6E68","#4A5578","#C2618D","#3AA6A6","#9A8F7E","#7C8C3E","#A64D9E","#4E7FBF","#B0563F","#5B8F72","#8C7853"];
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,"0");
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
function nextCategoryColor(existingCount, usedSet){
  const preset = COLOR_PRESETS.find(c=>!usedSet.has(c));
  if(preset) return preset;
  let idx = existingCount;
  let color;
  do{
    color = hslToHex((idx*137.508)%360, 55, 45); // golden-angle hue rotation: always visually distinct, never just repeats
    idx++;
  } while(usedSet.has(color) && idx < existingCount+50);
  return color;
}
const WD = ["日","月","火","水","木","金","土"];
const ROW_H = 56;

function pad(n){ return n.toString().padStart(2,"0"); }
function dkey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function isToday(d){ return sameDay(d, new Date()); }
function minutesOf(t){ if(!t) return null; const [h,m]=t.split(":").map(Number); return h*60+m; }
function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function tint(hex, alpha){
  const h = (hex||"#B7B2A6").replace("#","");
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function mixHex(hexA, hexB, ratio){
  const a = hexA.replace("#",""), b = hexB.replace("#","");
  const ar=parseInt(a.substring(0,2),16), ag=parseInt(a.substring(2,4),16), ab=parseInt(a.substring(4,6),16);
  const br=parseInt(b.substring(0,2),16), bg=parseInt(b.substring(2,4),16), bb=parseInt(b.substring(4,6),16);
  const r=Math.round(ar*ratio+br*(1-ratio)), g=Math.round(ag*ratio+bg*(1-ratio)), bl=Math.round(ab*ratio+bb*(1-ratio));
  return `rgb(${r},${g},${bl})`;
}

function getMonthWeeks(year, month){
  const first = new Date(year, month, 1);
  const startOffset = first.getDay();
  const start = new Date(year, month, 1 - startOffset);
  const lastDay = new Date(year, month+1, 0);
  const totalDays = startOffset + lastDay.getDate();
  const numWeeks = Math.ceil(totalDays/7);
  const weeks = []; let cur = new Date(start);
  for(let w=0; w<numWeeks; w++){
    const week=[];
    for(let d=0; d<7; d++){ week.push(new Date(cur)); cur.setDate(cur.getDate()+1); }
    weeks.push(week);
  }
  return weeks;
}
function getWeekDays(date){
  const startOffset = date.getDay();
  const start = new Date(date); start.setDate(date.getDate()-startOffset);
  const days=[];
  for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(start.getDate()+i); days.push(d); }
  return days;
}

  exportModalOpen: false,
  exportContent: "",
  theme: "light",
};

function loadTheme(){
  let theme;
  try{ theme = localStorage.getItem(THEME_KEY); }catch(e){}
  if(!theme){
    theme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  state.theme = theme;
  document.documentElement.setAttribute("data-theme", theme);
}
function setTheme(theme){
  state.theme = theme;
  document.documentElement.setAttribute("data-theme", theme);
  try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.categories && parsed.categories.length) state.categories = parsed.categories;
      if(parsed.events) state.events = parsed.events;
    }
  }catch(e){ /* first run */ }
}
function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({categories: state.categories, events: state.events}));
    state.saveError = false;
  }catch(e){ state.saveError = true; }
}

function eventOccursOnDate(e, d){
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if(Array.isArray(e.exceptions) && e.exceptions.includes(dkey(d))) return false;
  if(!e.recurrence || e.recurrence==="none"){
    const start = new Date(e.date+"T00:00:00");
    let end = e.endDate ? new Date(e.endDate+"T00:00:00") : start;
    if(end < start) end = start; // guard against corrupted/legacy data where endDate precedes date
    return target >= start && target <= end;
  }
  const base = new Date(e.date+"T00:00:00");
  const diffDays = Math.round((target-base)/86400000);
  if(diffDays < 0) return false;
  const monthDiff = (target.getFullYear()-base.getFullYear())*12 + (target.getMonth()-base.getMonth());
  if(e.recurrence==="daily") return true;
  if(e.recurrence==="weekly") return diffDays % 7 === 0;
  if(e.recurrence==="biweekly") return diffDays % 14 === 0;
  if(e.recurrence==="monthly") return target.getDate() === base.getDate();
  if(e.recurrence==="bimonthly") return target.getDate()===base.getDate() && monthDiff % 2 === 0;
  if(e.recurrence==="custom"){
    const n = Math.max(1, Number(e.customInterval)||1);
    const unit = e.customUnit || "week";
    if(unit==="day") return diffDays % n === 0;
    if(unit==="week") return diffDays % (7*n) === 0;
    if(unit==="month") return target.getDate()===base.getDate() && monthDiff % n === 0;
  }
  return false;
}
function getEventsForDate(d){
  const filtered = state.activeFilters.size===0 ? state.events : state.events.filter(e=>state.activeFilters.has(e.categoryId));
  return filtered.filter(e=>eventOccursOnDate(e, d));
}
function recurBadge(e){ return (e.recurrence && e.recurrence!=="none") ? " 🔁" : ""; }
function allDayBadge(e){ return e.time ? "" : `<span class="allday-tag">終日</span>`; }
function timeRangeLabel(e){
  if(!e.time) return "";
  return e.endTime ? `${e.time}~${e.endTime}` : e.time;
}

function bodyHTML(){
  if(state.view==="month") return monthHTML();
  if(state.view==="week") return weekHTML();
  return dayHTML();
}

function monthHTML(){
  const sundayHex = state.theme==="dark" ? "#E5707D" : "#D64550";
  const saturdayHex = state.theme==="dark" ? "#6FA0D8" : "#3B6FA0";
  const surfaceHex = state.theme==="dark" ? "#1E2226" : "#FFFFFF";
  const weekdayRow = `<div class="weekday-row">${WD.map((w,i)=>`<div style="color:${i===0?"var(--sunday)":i===6?"var(--saturday)":"var(--ink-soft)"}">${w}</div>`).join("")}</div>`;
  const weeks = getMonthWeeks(state.focusDate.getFullYear(), state.focusDate.getMonth());
  const rows = weeks.map(week=>{
    const cells = week.map((d,di)=>{
      const inMonth = d.getMonth()===state.focusDate.getMonth();
      const dayEvents = getEventsForDate(d);
      const dots = dayEvents.slice(0,3).map(e=>`<span class="dot" style="width:5px;height:5px;background:${(catById(e.categoryId)||{}).color || "#B7B2A6"}"></span>`).join("");
      const more = dayEvents.length>3 ? `<span class="more-count">+${dayEvents.length-3}</span>` : "";
      const cellBg = di===0 ? mixHex(sundayHex,surfaceHex,0.10) : di===6 ? mixHex(saturdayHex,surfaceHex,0.10) : "var(--surface)";
      return `<button class="day-cell ${isToday(d)?"today":""} ${inMonth?"":"dim"}" data-action="select-day" data-date="${dkey(d)}" style="background:${cellBg}">
        <span class="day-num" style="color:${di===0?"var(--sunday)":di===6?"var(--saturday)":"var(--ink)"};font-weight:${isToday(d)?700:400}">${d.getDate()}</span>
        <div class="day-dots">${dots}${more}</div>
      </button>`;
    }).join("");
    return `<div class="week-row">${cells}</div>`;
  }).join("");
  return `<div class="month-grid-wrap" style="padding:0 2px;">${weekdayRow}<div class="month-grid">${rows}</div></div>`;
}

function weekHTML(){
  const days = getWeekDays(state.focusDate);
  const cards = days.map((d,di)=>{

function dayUntimedChipsHTML(){

function dayHTML(){
  const all = getEventsForDate(state.focusDate);
  const timed = all.filter(e=>e.time);

  const hourRows = Array.from({length:24},(_,h)=>`
    <div class="hour-row">
      <div class="hour-label">${h}:00</div>
      <div class="hour-slot" data-action="new-event-at-hour" data-hour="${h}"></div>
    </div>`).join("");

  const now = new Date();
  const nowMin = now.getHours()*60+now.getMinutes();
  const nowLine = isToday(state.focusDate) ? `<div class="now-line" style="top:${(nowMin/60)*ROW_H}px"><span class="now-dot"></span><span class="now-bar"></span></div>` : "";

  const blocks = timed.map(e=>{
    const start = minutesOf(e.time);
    const endM = minutesOf(e.endTime);
    const dur = (Number.isFinite(endM) && endM>start) ? endM-start : 45;
    const top = (start/60)*ROW_H;
    const height = Math.max((dur/60)*ROW_H, 24);
    const color = (catById(e.categoryId)||{}).color || "#B7B2A6";
    return `<button class="event-block" data-action="edit-event" data-id="${e.id}" data-occurrence-date="${dkey(state.focusDate)}"
      style="top:${top}px;height:${height}px;background:${tint(color,0.16)};border-left:3px solid ${color}">
      <p class="event-title">${esc(e.title)}</p>
      ${height>30 ? `<p class="event-time">${timeRangeLabel(e)}</p>` : ""}
    </button>`;
  }).join("");

  return `<div class="day-view-wrap">
    <div class="timeline">${hourRows}${nowLine}${blocks}</div>
  </div>`;
}

            <button class="btn-primary" style="background:var(--bg);color:var(--accent)" onclick="document.getElementById('import-file').click()">読み込む</button>
          </div>
          <input type="file" id="import-file" accept="application/json" style="display:none" onchange="onImportFile(event)" />
          ${state.importError ? `<p style="font-size:12px;color:var(--danger);margin-top:8px">${esc(state.importError)}</p>` : ""}
        </div>
      </div>
    </div>`;
  }
  if(state.searchOpen){
    html += `<div class="overlay">
      <div class="sheet">
        <div class="sheet-close-row"><button class="icon-btn" style="background:var(--chip-bg)" data-action="close-search">${svgX()}</button></div>
        <h2>予定を検索</h2>
        <input id="search-input" class="field" placeholder="タイトルで検索" value="${esc(state.searchQuery||"")}" oninput="onSearchInput(this.value)" autofocus />
        <div id="search-results" style="margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto">${renderSearchResultsHTML(state.searchQuery||"")}</div>
      </div>
    </div>`;
  }
  if(state.pendingDeleteCat){
    const c = catById(state.pendingDeleteCat);
    html += `<div class="overlay">
      <div class="sheet">
        <div class="sheet-close-row"><button class="icon-btn" style="background:var(--chip-bg)" data-action="cancel-delete-category">${svgX()}</button></div>
        <h2>カテゴリを削除しますか？</h2>
        <p style="font-size:13px;color:var(--faint);margin:-6px 0 14px">「${esc(c?c.name:"")}」を削除します。このカテゴリを使っている予定は「カテゴリなし」になります。</p>
        <div class="actions-row">
          <button class="btn-danger" style="flex:1" data-action="delete-category" data-id="${state.pendingDeleteCat}">${svgTrash()} 削除する</button>
        </div>
      </div>
    </div>`;
  }
  if(state.exportModalOpen){
    html += `<div class="overlay">
      <div class="sheet">
        <div class="sheet-close-row"><button class="icon-btn" style="background:var(--chip-bg)" data-action="close-export-modal">${svgX()}</button></div>
        <h2>バックアップデータ</h2>
        <p style="font-size:12px;color:var(--faint);margin:-6px 0 8px">自動でダウンロードされない場合は、下の内容を全選択してコピーし、メモアプリ等に貼り付けて保存してください。</p>
        <textarea readonly class="field" style="height:200px;font-size:12px;font-family:monospace" onclick="this.select()">${esc(state.exportContent||"")}</textarea>
      </div>
    </div>`;
  }
  return html;
}

function renderSearchResultsHTML(query){
  const q = query.trim().toLowerCase();
  if(!q) return `<p style="text-align:center;padding:16px 0;color:var(--muted);font-size:14px">キーワードを入力してください</p>`;
  const matches = state.events
    .filter(e => (e.title||"").toLowerCase().includes(q))
    .sort((a,b)=> (a.date||"").localeCompare(b.date||""));
  if(matches.length===0) return `<p style="text-align:center;padding:16px 0;color:var(--muted);font-size:14px">見つかりませんでした</p>`;
  return matches.map(e=>{
    const d = new Date(e.date+"T00:00:00");
    const dateLabel = `${d.getMonth()+1}/${d.getDate()} (${WD[d.getDay()]})`;
    return `<button class="event-list-item" data-action="search-result" data-id="${e.id}">
      <span class="dot" style="background:${(catById(e.categoryId)||{}).color||"#B7B2A6"}"></span>
      <div style="flex:1;min-width:0">
        <p style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${allDayBadge(e)}${esc(e.title)}${recurBadge(e)}</p>
        <p style="font-size:12px;color:var(--faint)">${dateLabel}${e.time?` ・ ${timeRangeLabel(e)}`:""}</p>
      </div>
    </button>`;
  }).join("");
}
function onRecurrenceChange(value){
  const row = document.getElementById("custom-recurrence-row");
  if(row) row.style.display = value==="custom" ? "flex" : "none";
}
function onSearchInput(value){
  state.searchQuery = value;
  const container = document.getElementById("search-results");
  if(container) container.innerHTML = renderSearchResultsHTML(value);
}

function exportData(){
  const data = JSON.stringify({categories: state.categories, events: state.events}, null, 2);
  try{
    const blob = new Blob([data], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const d = new Date();
    a.download = `calendar-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>{ URL.revokeObjectURL(url); }, 3000);
  }catch(err){ /* fall through to the visible text fallback below */ }
  state.exportContent = data;
  state.exportModalOpen = true;
  render();
}
function onImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      const catsOk = !("categories" in parsed) || Array.isArray(parsed.categories);
      const evsOk = !("events" in parsed) || Array.isArray(parsed.events);
      if(!catsOk || !evsOk) throw new Error("invalid shape");
      if(Array.isArray(parsed.categories) && parsed.categories.length) state.categories = parsed.categories;
      if(Array.isArray(parsed.events)) state.events = parsed.events;
      persist();
      state.importError = "";
      render();
    }catch(err){
      state.importError = "読み込みに失敗しました。ファイルの形式を確認してください。";
      render();
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}

/* ---------- actions ---------- */
function openNewEvent(date, time){
  state.eventModal = { mode:"new", event:{ id:null, title:"", date: dkey(date), time: time||"", endDate: dkey(date), endTime:"", notes:"", recurrence:"none", customInterval:1, customUnit:"week", allDay:false, categoryId: state.categories[0]?.id || null } };
  render();
}
function openEditEvent(id, occurrenceDate){
  const e = state.events.find(ev=>ev.id===id);
  if(!e) return;
  state.eventModal = { mode:"edit", event:{...e}, occurrenceDate: occurrenceDate || e.date };
  render();
}
function syncEventModalFromDOM(){
  if(!state.eventModal) return;
  const t = document.getElementById("ev-title");
  const d = document.getElementById("ev-date");
  const tm = document.getElementById("ev-time");
  const ed = document.getElementById("ev-enddate");
  const et = document.getElementById("ev-endtime");
  const nt = document.getElementById("ev-notes");
  const rc = document.getElementById("ev-recurrence");
  const ci = document.getElementById("ev-custom-interval");
  const cu = document.getElementById("ev-custom-unit");
  if(t) state.eventModal.event.title = t.value;
  if(d) state.eventModal.event.date = d.value;
  if(tm) state.eventModal.event.time = tm.value;
  if(ed) state.eventModal.event.endDate = ed.value;
  if(et) state.eventModal.event.endTime = et.value;
  if(nt) state.eventModal.event.notes = nt.value;
  if(rc) state.eventModal.event.recurrence = rc.value;
  if(ci) state.eventModal.event.customInterval = Math.max(1, Number(ci.value)||1);
  if(cu) state.eventModal.event.customUnit = cu.value;
}

document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-action]");
  if(!el) return;
  if(el.classList.contains("overlay") && e.target !== el) return;
  const action = el.dataset.action;

  if(action==="nav-prev" || action==="nav-next"){
    const dir = action==="nav-prev" ? -1 : 1;
    const d = new Date(state.focusDate);
    if(state.view==="month") state.focusDate = new Date(d.getFullYear(), d.getMonth()+dir, 1);
    else if(state.view==="week"){ d.setDate(d.getDate()+dir*7); state.focusDate = d; }
    else { d.setDate(d.getDate()+dir); state.focusDate = d; }
    render(); return;
  }
  if(action==="goto-today"){ state.focusDate = new Date(); render(); return; }
  if(action==="toggle-theme"){ setTheme(state.theme==="dark" ? "light" : "dark"); render(); return; }
  if(action==="open-search"){ state.searchOpen = true; render(); return; }
  if(action==="close-search"){ state.searchOpen = false; render(); return; }
  if(action==="search-result"){
    const ev = state.events.find(x=>x.id===el.dataset.id);
    if(!ev) return;
    state.searchOpen = false;
    state.focusDate = new Date(ev.date+"T00:00:00");
    openEditEvent(ev.id);
    return;
  }
  if(action==="export-data"){ exportData(); return; }
  if(action==="close-export-modal"){ state.exportModalOpen = false; render(); return; }
  if(action==="set-view"){ state.view = el.dataset.view; render(); return; }
  if(action==="toggle-filter"){
    const id = el.dataset.id;
    state.activeFilters.has(id) ? state.activeFilters.delete(id) : state.activeFilters.add(id);
    render(); return;
  }
  if(action==="open-category-modal"){ state.categoryModalOpen = true; render(); return; }
  if(action==="close-category-modal"){ state.categoryModalOpen = false; state.pendingDeleteCat=null; state.categoryNameWarning=null; render(); return; }
  if(action==="select-day"){ state.selectedDay = new Date(el.dataset.date+"T00:00:00"); render(); return; }
  if(action==="close-sheet"){ state.selectedDay = null; render(); return; }
  if(action==="new-event-for-date"){ openNewEvent(new Date(el.dataset.date+"T00:00:00")); return; }
  if(action==="new-event-at-hour"){ openNewEvent(state.focusDate, `${pad(Number(el.dataset.hour))}:00`); return; }
  if(action==="fab-add"){
    const base = state.view==="day" ? state.focusDate : (state.selectedDay || state.focusDate);
    openNewEvent(base); return;
  }
  if(action==="edit-event"){ openEditEvent(el.dataset.id, el.dataset.occurrenceDate); return; }
  if(action==="close-event-modal"){ state.eventModal = null; state.selectedDay = null; render(); return; }
  if(action==="toggle-allday"){
    syncEventModalFromDOM();
    state.eventModal.event.allDay = !state.eventModal.event.allDay;
    render(); return;
  }
  if(action==="select-category"){
    syncEventModalFromDOM();
    state.eventModal.event.categoryId = el.dataset.id;
    render(); return;
  }
  if(action==="save-event"){
    syncEventModalFromDOM();
    const ev = state.eventModal.event;
    if(!(ev.title||"").trim()){ state.eventModal.formError = "タイトルを入力してください"; render(); return; }
    if(!ev.allDay && (!ev.time || !ev.endTime)){ state.eventModal.formError = "開始と終了の時刻を入力してください"; render(); return; }
    if(!ev.allDay){
      const endDateVal = ev.endDate || ev.date;
      if(endDateVal===ev.date && ev.endTime < ev.time){
        state.eventModal.formError = "終了時刻は開始時刻より後にしてください";
        render(); return;
      }
    }
    if(ev.allDay){ ev.time = ""; ev.endTime = ""; }
    if(state.eventModal.mode==="new"){
      state.events.push({...ev, id: `${Date.now()}`});
    } else {
      state.events = state.events.map(x=> x.id===ev.id ? ev : x);
    }
    persist();
    state.eventModal = null;
    state.selectedDay = null;
    render(); return;
  }
  if(action==="delete-occurrence"){
    const id = el.dataset.id;
    const occDate = state.eventModal ? state.eventModal.occurrenceDate : null;
    state.events = state.events.map(x=>{
      if(x.id!==id) return x;
      const exceptions = Array.isArray(x.exceptions) ? x.exceptions.slice() : [];
      if(occDate && !exceptions.includes(occDate)) exceptions.push(occDate);
      return {...x, exceptions};
    });
    persist();
    state.eventModal = null;
    state.selectedDay = null;
    render(); return;
  }
  if(action==="delete-event"){
    state.events = state.events.filter(x=>x.id!==el.dataset.id);
    persist();
    state.eventModal = null;
    state.selectedDay = null;
    render(); return;
  }
  if(action==="add-category"){
    const used = new Set(state.categories.map(c=>c.color));
    const color = nextCategoryColor(state.categories.length, used);
    const newId = `${Date.now()}`;
    state.categories.push({ id:newId, name:"", color });
    persist(); render();
    const input = document.querySelector(`.cat-name-input[data-id="${newId}"]`);
    if(input) input.focus();
    return;
  }
  if(action==="confirm-delete-category"){ state.pendingDeleteCat = el.dataset.id; render(); return; }
  if(action==="cancel-delete-category"){ state.pendingDeleteCat = null; render(); return; }
  if(action==="delete-category"){
    const id = el.dataset.id;
    state.categories = state.categories.filter(c=>c.id!==id);
    state.events = state.events.map(x=> x.categoryId===id ? {...x, categoryId:null} : x);
    state.activeFilters.delete(id);
    state.pendingDeleteCat = null;
    persist(); render(); return;
  }
});

document.addEventListener("change", (e)=>{
  const field = e.target.dataset.field;
  if(field==="jump-year" || field==="jump-month"){
    const y = field==="jump-year" ? Number(e.target.value) : state.focusDate.getFullYear();
    const m = field==="jump-month" ? Number(e.target.value) : state.focusDate.getMonth();
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const day = Math.min(state.focusDate.getDate(), daysInMonth);
    state.focusDate = new Date(y, m, day);
    render(); return;
  }
  if(field==="cat-name"){
    const id = e.target.dataset.id;
    if(!e.target.value.trim()){
      state.categoryNameWarning = id;
      render();
      return;
    }
    state.categoryNameWarning = null;
    state.categories = state.categories.map(c=> c.id===id ? {...c, name:e.target.value} : c);
    persist(); render(); return;
  }
  if(field==="cat-color"){
    const id = e.target.dataset.id;
    state.categories = state.categories.map(c=> c.id===id ? {...c, color:e.target.value} : c);
    persist(); render(); return;
  }
});

/* ---------- init ---------- */
/* ---------- prevent iOS zoom gestures (belt-and-suspenders on top of CSS touch-action) ---------- */
document.addEventListener("gesturestart", (e)=>{ e.preventDefault(); });
document.addEventListener("gesturechange", (e)=>{ e.preventDefault(); });
let lastTouchEndTime = 0;
document.addEventListener("touchend", (e)=>{
  const now = Date.now();
  if(now - lastTouchEndTime <= 350){ e.preventDefault(); }
  lastTouchEndTime = now;
}, {passive:false});

loadTheme();
load();
render();

/* ---------- category drag-to-reorder ---------- */
let dragCtx = null;
let pressTimer = null;

document.addEventListener("pointerdown", (e)=>{
  const handle = e.target.closest("[data-drag-handle]");
  if(!handle) return;
  e.preventDefault();
  const row = handle.closest(".cat-row");
  const list = document.getElementById("cat-rows-list");
  if(!row || !list) return;
  const startClientY = e.clientY;
  const pointerId = e.pointerId;

  clearTimeout(pressTimer);
  pressTimer = setTimeout(()=>{
    const items = Array.from(list.children);
    const originalIndex = items.indexOf(row);
    const rect = row.getBoundingClientRect();
    const slot = rect.height + 8; // row height + CSS gap between rows
    dragCtx = {
      row, list, pointerId, items, originalIndex, slot,
      startY: startClientY,
      targetIndex: originalIndex,
    };
    row.classList.add("dragging");
    row.style.transition = "none";
    row.style.zIndex = "5";
    row.style.transform = "scale(1.03)";
    list.style.touchAction = "none";
    const sheetEl = row.closest(".sheet");
    if(sheetEl){ dragCtx.sheetEl = sheetEl; sheetEl.style.touchAction = "none"; }
    try{ row.setPointerCapture(pointerId); }catch(err){}
  }, 160);

  document.addEventListener("pointerup", ()=>{ clearTimeout(pressTimer); }, {once:true});
});

document.addEventListener("pointermove", (e)=>{
  if(!dragCtx || e.pointerId !== dragCtx.pointerId) return;
  e.preventDefault();
  const dy = e.clientY - dragCtx.startY;
  dragCtx.row.style.transform = `translateY(${dy}px) scale(1.03)`;

  const n = dragCtx.items.length;
  const rawShift = Math.round(dy / dragCtx.slot);
  const newTarget = Math.min(n-1, Math.max(0, dragCtx.originalIndex + rawShift));
  dragCtx.targetIndex = newTarget;

  dragCtx.items.forEach((item, idx)=>{
    if(item === dragCtx.row) return;
    let shift = 0;
    if(dragCtx.originalIndex < newTarget){
      if(idx > dragCtx.originalIndex && idx <= newTarget) shift = -1;
    } else if(dragCtx.originalIndex > newTarget){
      if(idx >= newTarget && idx < dragCtx.originalIndex) shift = 1;
    }
    item.style.transition = "transform 0.15s ease";
    item.style.transform = shift===0 ? "" : `translateY(${shift*dragCtx.slot}px)`;
  });
}, {passive:false});

document.addEventListener("pointerup", (e)=>{
  if(!dragCtx || e.pointerId !== dragCtx.pointerId) return;
  const { items, originalIndex, targetIndex, list, row, sheetEl } = dragCtx;

  const reordered = items.slice();
  const [moved] = reordered.splice(originalIndex, 1);
  reordered.splice(targetIndex, 0, moved);
  const orderedIds = reordered.map(el=>el.dataset.catId);

  items.forEach(item=>{ item.style.transform=""; item.style.transition=""; item.style.zIndex=""; });
  row.classList.remove("dragging");
  list.style.touchAction = "";
  if(sheetEl) sheetEl.style.touchAction = "";

  state.categories = orderedIds.map(id=>state.categories.find(c=>c.id===id)).filter(Boolean);
  persist();
  dragCtx = null;
  render();
});
</script>
